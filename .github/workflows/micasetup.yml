name: build

on:
  release:
    types: [created]
  push:
    branches:
      - v2

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Prepare dummy files `publish.7z` and `Uninst.exe`
        run: echo publish.7z > .\build\MicaSetup\Resources\Setups\publish.7z && echo uninst.exe > .\build\MicaSetup\Resources\Setups\Uninst.exe

      - name: Install dependencies of uninst
        run: dotnet restore build\MicaSetup\MicaSetup.Uninst.csproj

      - name: Install dependencies of setup
        run: dotnet restore build\MicaSetup\MicaSetup.csproj

      - name: Build uninst
        run: dotnet build build\MicaSetup\MicaSetup.Uninst.csproj --configuration Release --no-restore

      - name: Build setup
        run: dotnet build build\MicaSetup\MicaSetup.csproj --configuration Release --no-restore